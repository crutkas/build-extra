name: ARM64 x64 ownership ledger

on:
  pull_request:
    paths:
      - .github/workflows/arm64-x64-ledger.yml
      - arm64-validation/**

permissions:
  contents: read

concurrency:
  group: arm64-x64-ledger-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  verify-ledger:
    name: verify-ledger-${{ matrix.runtime }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: powershell-5.1
          - runtime: powershell-7
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact-head binding
        shell: powershell
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or
              -not [StringComparer]::Ordinal.Equals($actual, $env:EXPECTED_HEAD)) {
              throw "Checkout is not the exact pull-request head"
          }
          if (git status --porcelain) {
              throw "Checkout is not clean before ledger generation"
          }

      - name: Regenerate from immutable inputs
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEDGER_RUNTIME: ${{ matrix.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = switch ($env:LEDGER_RUNTIME) {
            'powershell-5.1' {
              (Get-Command powershell.exe -CommandType Application).Source
            }
            'powershell-7' {
              (Get-Command pwsh.exe -CommandType Application).Source
            }
            default {
              throw "Unknown ledger runtime: $env:LEDGER_RUNTIME"
            }
          }
          $privateRoot = Join-Path `
            $env:RUNNER_TEMP `
            ('arm64-ledger-' + [Guid]::NewGuid().ToString('N'))
          & $runtime `
            -NoLogo `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File .\arm64-validation\generate-arm64-x64-ledger.ps1 `
            -PrivateRoot $privateRoot
          if ($LASTEXITCODE -ne 0) {
              throw "Ledger generation failed"
          }
          if (Test-Path -LiteralPath $privateRoot) {
              throw "Private generation root was not removed"
          }
          git diff --exit-code -- arm64-validation/artifacts/v2.55.0.4
          if ($LASTEXITCODE -ne 0) {
              throw "Committed artifacts differ from regenerated bytes"
          }

      - name: Run strict checker
        shell: powershell
        env:
          LEDGER_RUNTIME: ${{ matrix.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = if ($env:LEDGER_RUNTIME -eq 'powershell-5.1') {
            (Get-Command powershell.exe -CommandType Application).Source
          } elseif ($env:LEDGER_RUNTIME -eq 'powershell-7') {
            (Get-Command pwsh.exe -CommandType Application).Source
          } else {
            throw "Unknown ledger runtime: $env:LEDGER_RUNTIME"
          }
          & $runtime `
            -NoLogo `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File .\arm64-validation\check-arm64-x64-ledger.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "Strict ledger checker failed"
          }

      - name: Run adversarial tests
        shell: powershell
        env:
          LEDGER_RUNTIME: ${{ matrix.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = if ($env:LEDGER_RUNTIME -eq 'powershell-5.1') {
            (Get-Command powershell.exe -CommandType Application).Source
          } elseif ($env:LEDGER_RUNTIME -eq 'powershell-7') {
            (Get-Command pwsh.exe -CommandType Application).Source
          } else {
            throw "Unknown ledger runtime: $env:LEDGER_RUNTIME"
          }
          & $runtime `
            -NoLogo `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File .\arm64-validation\test-arm64-x64-ledger.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "Adversarial ledger tests failed"
          }

      - name: Write exact-run evidence
        shell: powershell
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          MATRIX_RUNTIME: ${{ matrix.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimePath = if ($env:MATRIX_RUNTIME -eq 'powershell-5.1') {
            (Get-Command powershell.exe -CommandType Application).Source
          } elseif ($env:MATRIX_RUNTIME -eq 'powershell-7') {
            (Get-Command pwsh.exe -CommandType Application).Source
          } else {
            throw "Unknown ledger runtime: $env:MATRIX_RUNTIME"
          }
          $runtimeVersion =
            [Diagnostics.FileVersionInfo]::GetVersionInfo(
              $runtimePath).ProductVersion
          Import-Module .\arm64-validation\Arm64Ledger.psm1 `
            -Force `
            -DisableNameChecking
          $manifest = Get-StableFileHash `
            -Path .\arm64-validation\artifacts\v2.55.0.4\manifest.json
          $evidence = [ordered]@{
            eventName = $env:GITHUB_EVENT_NAME
            executionEnvironment = [ordered]@{
              imageOs = $env:ImageOS
              imageVersion = $env:ImageVersion
              provenanceIdentity = $false
              psEdition = $env:MATRIX_RUNTIME
              psVersion = $runtimeVersion
            }
            head = $env:EXPECTED_HEAD
            manifestSha256 = $manifest.sha256
            manifestSize = $manifest.length
            ref = $env:GITHUB_REF
            repository = $env:GITHUB_REPOSITORY
            runAttempt = [long]$env:GITHUB_RUN_ATTEMPT
            runId = [long]$env:GITHUB_RUN_ID
            runtime = $env:MATRIX_RUNTIME
            schemaVersion = [long]1
          }
          [IO.File]::WriteAllBytes(
            (Join-Path $env:RUNNER_TEMP 'run-evidence.json'),
            (ConvertTo-CanonicalJsonBytes -Value $evidence))

      - name: Retain canonical artifacts and run evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm64-x64-ledger-${{ matrix.runtime }}-${{ github.event.pull_request.head.sha }}
          path: |
            arm64-validation/artifacts/v2.55.0.4
            ${{ runner.temp }}/run-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Record uploaded artifact identity
        shell: powershell
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ARTIFACT_ID -notmatch '^[0-9]+$' -or
              $env:ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$' -or
              $env:ARTIFACT_URL -notmatch '^https://github\.com/') {
              throw "Upload action did not return a complete artifact identity"
          }
          @(
            "artifact-id=$env:ARTIFACT_ID",
            "artifact-digest=sha256:$env:ARTIFACT_DIGEST",
            "artifact-url=$env:ARTIFACT_URL"
          ) | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

  ledger-required:
    name: ledger-required
    if: always()
    needs:
      - verify-ledger
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Reject failed, cancelled, or skipped verification
        shell: pwsh
        env:
          VERIFY_RESULT: ${{ needs.verify-ledger.result }}
        run: |
          if (-not [StringComparer]::Ordinal.Equals(
              $env:VERIFY_RESULT,
              'success')) {
              throw "verify-ledger result was '$env:VERIFY_RESULT'"
          }
