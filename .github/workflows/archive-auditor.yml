name: Archive auditor

on:
  pull_request:
    paths:
      - README.md
      - archive-auditor.md
      - archive-auditor.py
      - t/test_archive_auditor.py
      - t/test_a6_provenance.py
      - .github/workflows/archive-auditor.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-auditor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "314159"

jobs:
  archive-auditor-ubuntu:
    name: archive-auditor-ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Run archive auditor tests
        run: python -B -m unittest discover -s t -p 'test*.py'

  archive-auditor-windows:
    name: archive-auditor-windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Run archive auditor tests
        run: python -B -m unittest discover -s t -p 'test*.py'

  archive-auditor-required:
    name: archive-auditor-required
    if: always()
    needs:
      - archive-auditor-ubuntu
      - archive-auditor-windows
    runs-on: ubuntu-latest
    steps:
      - name: Require both platform jobs
        env:
          UBUNTU_RESULT: ${{ needs.archive-auditor-ubuntu.result }}
          WINDOWS_RESULT: ${{ needs.archive-auditor-windows.result }}
        run: test "$UBUNTU_RESULT" = success && test "$WINDOWS_RESULT" = success
