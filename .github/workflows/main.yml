name: ARM64 PR governance

# Bootstrap: PR #17 cannot self-admit because main lacks this trusted gate.
# It requires an independent read-only audit of the exact diff before merge.
# Session trailers: take the Copilot-Session identifier from the
# COPILOT_AGENT_SESSION_ID environment variable and verify it resolves to an
# existing directory under the CLI session-state folder before committing.
# Never take it from the prompt header, and never from the mc_session_id or
# mc_task_id fields of session-state workspace.yaml; those are different
# identifiers that do not resolve as session-state directories, and
# workspace.yaml carries them in its final lines while the correct id field
# is its first.
# Every one of these is a lowercase UUID, so a wrong value is invisible on
# inspection and only the resolution check catches it: the identifier either
# exists as a session-state directory or it does not.
on: pull_request_target

permissions:
  contents: read

jobs:
  arm64-governance:
    runs-on: ubuntu-latest
    outputs:
      inputs-locked: ${{ steps.governance.outputs.inputs-locked }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: evaluate candidate with trusted governance
        id: governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node trusted/validate-arm64-governance.js admission trusted "$CANDIDATE_REPOSITORY" "$BASE_SHA" "$HEAD_SHA"
