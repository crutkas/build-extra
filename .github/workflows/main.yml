name: ARM64 PR governance

# Bootstrap: PR #17 cannot self-admit because main lacks this trusted gate.
# It requires an independent read-only audit of the exact diff before merge.
# Session trailers: the Copilot-Session identifier written into a commit
# must be read from the CLI session-state folder set on disk, and must never
# be taken from the prompt header, which supplies an app project-session
# identifier from a different namespace. Both namespaces are lowercase
# UUIDs, so a wrong identifier is invisible on inspection. The only check is
# mechanical: the identifier either exists as a session-state folder or it
# does not.
on: pull_request_target

permissions:
  contents: read

jobs:
  arm64-governance:
    runs-on: ubuntu-latest
    outputs:
      inputs-locked: ${{ steps.governance.outputs.inputs-locked }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: evaluate candidate with trusted governance
        id: governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node trusted/validate-arm64-governance.js admission trusted "$CANDIDATE_REPOSITORY" "$BASE_SHA" "$HEAD_SHA"
