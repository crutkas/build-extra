name: PR build

on: pull_request

env:
  GIT_CONFIG_PARAMETERS: "'checkout.workers=56'"

jobs:
  determine-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: determine packages to build
        id: set-matrix
        shell: bash
        run: |
          define_matrix () {
            comm -12 "$2" "$3" >"$4" &&
            cat "$4" &&
            sed -e 's/\/$//' -e 's/.*/"&", /' -e '$s/, $//' <"$4" >list.txt &&
            echo "$1=[$(test ! -s list.txt && echo '""' || tr -d '\n' <list.txt)]" >>$GITHUB_OUTPUT
          }

          show_files () {
            {
              echo "::group::$1" &&
              cat "$1" &&
              echo "::endgroup::"
            } >&2
          }

          git diff ${{github.event.pull_request.base.sha}}... --name-only |
            sed \
              -e '/^make-file-list\.sh$/ainstaller/' \
              -e '/^make-file-list\.sh$/aportable/' \
              -e '/^make-file-list\.sh$/amingit/' \
              -e '/^make-file-list\.sh$/anuget/' \
              -e '/^7-Zip\//aportable/' \
              -e 's|^\(installer/\).*|\1|' \
              -e 's|[^/]*$||' |
            sort -u >touched.txt &&
          show_files touched.txt &&

          git ls-files \*/PKGBUILD | sed 's|[^/]*$||' | sort >directories.txt &&
          show_files directories.txt &&
          define_matrix matrix directories.txt touched.txt packages.txt &&
          show_files packages.txt &&

          test -z "$(git log -L :create_sdk_artifact:please.sh ${{github.event.pull_request.base.sha}}.. -- )" &&
          test 200 -gt $(($(git diff --numstat ${{github.event.pull_request.base.sha}}.. -- please.sh | cut -f 2))) &&
          test -z "$(git diff ${{github.event.pull_request.base.sha}}.. -- make-file-list.sh)" ||
          echo "test-sdk-artifacts=true" >>$GITHUB_OUTPUT

          git ls-files \*/release.sh | sed 's|[^/]*$||' | sort >releaseable.txt &&
          if grep -q test-sdk-artifacts=true $GITHUB_OUTPUT
          then
            # This is already tested as part of the `sdk-artifacts` matrix
            sed -i '/^\(installer\)\/$/d' releaseable.txt
          fi &&
          show_files releaseable.txt &&
          define_matrix artifacts releaseable.txt touched.txt artifacts.txt &&
          show_files artifacts.txt ||
          exit $?

          test -z "$(git diff ${{github.event.pull_request.base.sha}}.. -- \
            arm64-busybox/ \
            check-for-missing-dlls.sh \
            post-install.bat \
            t/check-arm64-busybox.sh \
            t/check-arm64-busybox.ps1 \
            t/check-arm64-busybox-architecture.sh \
            t/check-arm64-busybox-distributions.ps1 \
            t/check-arm64-native-tools.sh \
            t/check-arm64-native-tools.ps1 \
            t/check-arm64-openssh-integration.sh \
            t/check-arm64-openssh-installer.ps1 \
            t/check-arm64-openssh-package.ps1)" ||
          echo "check-for-missing-dlls=true" >>$GITHUB_OUTPUT
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      artifacts: ${{ steps.set-matrix.outputs.artifacts }}
      test-sdk-artifacts: ${{ steps.set-matrix.outputs.test-sdk-artifacts }}
      check-for-missing-dlls: ${{ steps.set-matrix.outputs.check-for-missing-dlls }}
  build-packages:
    needs: determine-packages
    if: needs.determine-packages.outputs.matrix != '[""]'
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.determine-packages.outputs.matrix) }}
        architecture:
          - name: x86_64
            runner: windows-latest
          - name: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.architecture.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
        with:
          flavor: full
          architecture: ${{ matrix.architecture.name }}
      - name: build ${{ matrix.directory }}
        id: build
        shell: bash
        run: |
          top_dir=$PWD &&
          cd "${{ matrix.directory }}" &&
          MAKEFLAGS=-j8 makepkg-mingw -s --noconfirm &&
          artifacts="$(basename "${{ matrix.directory }}")-artifacts-${{ matrix.architecture.name }}" &&
          mkdir -p "$top_dir/$artifacts" &&
          mv *.tar.* "$top_dir/$artifacts"/ &&
          echo "result=$artifacts" >>$GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.result }}
          path: ${{ steps.build.outputs.result }}
      - name: measure ARM64 artifact downloads
        if: matrix.architecture.name == 'aarch64'
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath "${{ steps.build.outputs.result }}" -File |
            ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }
      - name: ensure that the Git worktree is still clean
        shell: bash
        run: |
          cd "${{ matrix.directory }}" &&
          if ! git update-index --ignore-submodules --refresh ||
            ! git diff-files --ignore-submodules ||
            ! git diff-index --cached --ignore-submodules HEAD
          then
            echo "::error::Uncommitted changes after build!" >&2
            git diff
            exit 1
          fi
  build-artifacts:
    needs: determine-packages
    if: needs.determine-packages.outputs.artifacts != '[""]'
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.determine-packages.outputs.artifacts) }}
        architecture:
          - name: x86_64
            runner: windows-latest
            git-sdk: git-sdk-64
            mingw-prefix: mingw64
            msystem: MINGW64
          - name: aarch64
            runner: windows-11-arm
            git-sdk: git-sdk-arm64
            mingw-prefix: clangarm64
            msystem: CLANGARM64
        exclude:
          - directory: nuget
            architecture:
              name: aarch64
    runs-on: ${{ matrix.architecture.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: initialize bare SDK clone
        shell: bash
        run: |
          git clone --bare --depth=1 --single-branch --branch=main --filter=blob:none \
            https://github.com/git-for-windows/${{ matrix.architecture.git-sdk }} .sdk
      - name: build build-installers-64 artifact
        shell: bash
        run: |
          ./please.sh create-sdk-artifact \
            --architecture=${{ matrix.architecture.name }} \
            --sdk=.sdk \
            --out=sdk-artifact \
            build-installers &&
          cygpath -aw "$PWD/sdk-artifact/usr/bin/core_perl" >>$GITHUB_PATH &&
          cygpath -aw "$PWD/sdk-artifact/usr/bin" >>$GITHUB_PATH &&
          cygpath -aw "$PWD/sdk-artifact/${{ matrix.architecture.mingw-prefix }}/bin" >>$GITHUB_PATH &&
          echo "MSYSTEM=${{ matrix.architecture.msystem }}" >>$GITHUB_ENV
      - name: download the verified ARM64 OpenSSH package
        if: matrix.architecture.name == 'aarch64'
        shell: pwsh
        run: |
          $url = "https://github.com/crutkas/build-extra/releases/download/win32-openssh-client-10.0.0.0-2-arm64/mingw-w64-clang-aarch64-win32-openssh-client-10.0.0.0-2-any.pkg.tar.zst"
          curl.exe -fL --retry 3 -o "$env:RUNNER_TEMP\win32-openssh.pkg.tar.zst" $url
      - name: validate the Pacman-owned ARM64 OpenSSH package
        if: matrix.architecture.name == 'aarch64'
        shell: pwsh
        run: |
          ./t/check-arm64-openssh-package.ps1 `
            -Package "$env:RUNNER_TEMP\win32-openssh.pkg.tar.zst" `
            -Scanner (Convert-Path ./pe-imports.ps1) `
            -SdkRoot (Convert-Path sdk-artifact)
      - name: build ${{ matrix.directory }}/
        shell: bash
        id: build
        run: |
          artifacts="$(basename "${{ matrix.directory }}")-artifacts-${{ matrix.architecture.name }}" &&
          mkdir -p "$artifacts" &&
          ./"${{ matrix.directory }}"/release.sh --output="$PWD/$artifacts/" 0-test &&
          if test mingit = "${{ matrix.directory }}" &&
            test aarch64 = "${{ matrix.architecture.name }}"
          then
            mkdir -p "$artifacts/busybox" &&
            ./mingit/release.sh --busybox \
              --output="$PWD/$artifacts/busybox/" 0-test
          fi &&
          echo "result=$artifacts" >>$GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.result }}
          path: ${{ steps.build.outputs.result }}
      - name: run the installer
        if: matrix.directory == 'installer'
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path ${{ steps.build.outputs.result }}/*.exe | %{$_.FullName}
          $installer = Start-Process -PassThru -Wait -FilePath "$exePath" -ArgumentList "/SILENT /VERYSILENT /NORESTART /SUPPRESSMSGBOXES /ALLOWDOWNGRADE=1 /ALLOWINSTALLING32ON64=1 /LOG=installer.log"
          $exitCode = $installer.ExitCode
          if ($exitCode -ne 0) {
            Write-Host "::error::Installer failed with exit code $exitCode!"
            exit 1
          }
          "$env:ProgramFiles\Git\usr\bin" | Out-File -Encoding ascii -Append $env:GITHUB_PATH
          "$env:ProgramFiles\Git\${{ matrix.architecture.mingw-prefix }}\bin" | Out-File -Encoding ascii -Append $env:GITHUB_PATH
      - name: show installer log
        # run this even if the installation failed (actually, _in particular_ when the installation failed)
        if: always() && matrix.directory == 'installer'
        shell: bash
        run: cat installer.log
      - name: validate
        if: matrix.directory == 'installer'
        shell: bash
        run: |
          set -x &&
          grep 'Installation process succeeded' installer.log &&
          ! grep -iw failed installer.log &&
          cygpath -aw / &&
          git.exe version --build-options >version &&
          cat version &&
          checklist=installer/run-checklist.sh &&
          if test aarch64 != "${{ matrix.architecture.name }}"
          then
            # Keep the existing read-only fallback outside ARM64.
            sed -i 's|git@ssh.dev.azure.com:v3/git-for-windows/git/git|https://github.com/git/git|' $checklist
          else
            export GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new'
          fi &&
          sh -x $checklist
      - name: validate ARM64 BusyBox installer payload
        if: matrix.directory == 'installer' && matrix.architecture.name == 'aarch64'
        shell: pwsh
        run: ./t/check-arm64-busybox.ps1 -Root "$env:ProgramFiles\Git"
      - name: extract Portable Git
        if: matrix.directory == 'portable'
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path ${{ steps.build.outputs.result }}/*.7z.exe | %{$_.FullName}
          $portableRoot = "$env:RUNNER_TEMP\portable-git"
          Get-ChildItem -Path "$exePath"
          $installer = Start-Process -PassThru -Wait -FilePath "$exePath" -ArgumentList "-o $portableRoot -y"
          $exitCode = $installer.ExitCode
          if ($exitCode -ne 0) {
            Write-Host "::error::Extracting the Portable Git failed with exit code $exitCode!"
            exit 1
          }
          Get-ChildItem -Path $portableRoot
          "$portableRoot\usr\bin" | Out-File -Encoding ascii -Append $env:GITHUB_PATH
          "$portableRoot\${{ matrix.architecture.mingw-prefix }}\bin" | Out-File -Encoding ascii -Append $env:GITHUB_PATH
      - name: validate
        if: matrix.directory == 'portable'
        shell: bash
        run: |
          set -x &&
          root="$(cygpath -aw /)" &&
          test "${root%portable-git}" != "$root" &&
          git.exe version --build-options >version &&
          cat version
      - name: validate ARM64 BusyBox portable payload
        if: matrix.directory == 'portable' && matrix.architecture.name == 'aarch64'
        shell: pwsh
        run: ./t/check-arm64-busybox.ps1 -Root "$env:RUNNER_TEMP\portable-git"
      - name: extract and validate ARM64 MinGit modes
        if: matrix.directory == 'mingit' && matrix.architecture.name == 'aarch64'
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "${{ steps.build.outputs.result }}/*.zip" |
           Select-Object -First 1
          $minGitRoot = "$env:RUNNER_TEMP\mingit-root"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $minGitRoot
          & "$minGitRoot/cmd/git.exe" version --build-options
          if ($LASTEXITCODE -ne 0) {
           throw "Standard MinGit validation failed"
          }
          ./t/check-arm64-busybox.ps1 `
           -Root $minGitRoot `
           -AllowMissingReplacements

          $busyboxZip = Get-ChildItem -Path "${{ steps.build.outputs.result }}/busybox/*.zip" |
           Select-Object -First 1
          $busyboxMinGitRoot = "$env:RUNNER_TEMP\mingit-busybox-root"
          Expand-Archive -LiteralPath $busyboxZip.FullName -DestinationPath $busyboxMinGitRoot
          & "$busyboxMinGitRoot/cmd/git.exe" version --build-options
          if ($LASTEXITCODE -ne 0) {
           throw "BusyBox MinGit Git validation failed"
          }
          ./t/check-arm64-busybox.ps1 `
           -Root $busyboxMinGitRoot `
           -AllowMissingReplacements
          & "$busyboxMinGitRoot/clangarm64/bin/ash.exe" -c "uname -m"
          if ($LASTEXITCODE -ne 0) {
           throw "BusyBox MinGit shell validation failed"
          }
      - name: validate the ARM64 OpenSSH runtime
        if: matrix.architecture.name == 'aarch64'
        shell: pwsh
        run: |
          $root = switch ("${{ matrix.directory }}") {
            "installer" { "$env:ProgramFiles\Git" }
            "portable" { "$env:RUNNER_TEMP\portable-git" }
            "mingit" { "$env:RUNNER_TEMP\mingit-root" }
            default { throw "Unexpected artifact: ${{ matrix.directory }}" }
          }
          $parameters = @{
            Package = "$env:RUNNER_TEMP\win32-openssh.pkg.tar.zst"
            Scanner = (Convert-Path ./pe-imports.ps1)
            RuntimeRoot = $root
          }
          if ("${{ matrix.directory }}" -eq "mingit") {
            $parameters.MinGit = $true
          }
          ./t/check-arm64-openssh-package.ps1 @parameters
      - name: validate ARM64 installer lifecycle and external SSH
        if: always() && matrix.architecture.name == 'aarch64' && matrix.directory == 'installer'
        shell: pwsh
        run: |
          $exePath = (Get-ChildItem -Path ${{ steps.build.outputs.result }}/*.exe | Select-Object -First 1).FullName
          ./t/check-arm64-openssh-installer.ps1 `
            -Installer $exePath `
            -Package "$env:RUNNER_TEMP\win32-openssh.pkg.tar.zst" `
            -Scanner (Convert-Path ./pe-imports.ps1)
  sdk-artifacts:
    needs: determine-packages
    if: needs.determine-packages.outputs.test-sdk-artifacts == 'true'
    strategy:
      fail-fast: false
      matrix:
        artifact: ['minimal', 'makepkg-git', 'build-installers', 'full']
        arch:
          - name: i686
            mingw-prefix: mingw32
            msystem: MINGW32
            sdk-repo: git-sdk-32
            runner: windows-latest
          - name: x86_64
            mingw-prefix: mingw64
            msystem: MINGW64
            sdk-repo: git-sdk-64
            runner: windows-latest
          - name: aarch64
            mingw-prefix: clangarm64
            msystem: CLANGARM64
            sdk-repo: git-sdk-arm64
            runner: windows-11-arm
        exclude:
          - artifact: minimal
            arch:
              name: i686
              mingw-prefix: mingw32
              msystem: MINGW32
              sdk-repo: git-sdk-32
          - artifact: makepkg-git
            arch:
              name: i686
              mingw-prefix: mingw32
              msystem: MINGW32
              sdk-repo: git-sdk-32
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: initialize bare SDK clone
        shell: bash
        run: |
          case "${{ matrix.artifact }}" in
          full) partial=;;
          *) partial=--filter=blob:none;;
          esac &&
          git clone --bare --depth=1 --single-branch --branch=main $partial \
            https://github.com/git-for-windows/${{ matrix.arch.sdk-repo }} .sdk
      - name: build ${{ matrix.artifact }} artifact
        id: build-artifact
        shell: bash
        run: |
          set -x &&
          case "${{ matrix.artifact }}" in
          full)
            git --git-dir=.sdk worktree add --detach sdk-artifact
            ;;
          *)
            ./please.sh create-sdk-artifact \
              --architecture=${{ matrix.arch.name }} \
              --sdk=.sdk \
              --out=sdk-artifact \
              ${{ matrix.artifact }}
            ;;
          esac &&
          if test aarch64 = "${{ matrix.arch.name }}" &&
            test full = "${{ matrix.artifact }}"
          then
            ./please.sh use-arm64-native-openssh --root=sdk-artifact
          fi &&
          ls -la sdk-artifact/ &&
          version="$(sdk-artifact/${{ matrix.arch.mingw-prefix }}/bin/git.exe version)" &&
          echo "git-version=$version" >>$GITHUB_OUTPUT &&
          cygpath -aw "$PWD/sdk-artifact/usr/bin/core_perl" >>$GITHUB_PATH &&
          cygpath -aw "$PWD/sdk-artifact/usr/bin" >>$GITHUB_PATH &&
          cygpath -aw "$PWD/sdk-artifact/${{ matrix.arch.mingw-prefix }}/bin" >>$GITHUB_PATH &&
          echo "MSYSTEM=${{ matrix.arch.msystem }}" >>$GITHUB_ENV &&
          cat $GITHUB_PATH
      - name: download the verified ARM64 OpenSSH package
        if: matrix.arch.name == 'aarch64' && (matrix.artifact == 'build-installers' || matrix.artifact == 'full')
        shell: pwsh
        run: |
          $url = "https://github.com/crutkas/build-extra/releases/download/win32-openssh-client-10.0.0.0-2-arm64/mingw-w64-clang-aarch64-win32-openssh-client-10.0.0.0-2-any.pkg.tar.zst"
          curl.exe -fL --retry 3 -o "$env:RUNNER_TEMP\win32-openssh.pkg.tar.zst" $url
      - name: validate the Pacman-owned ARM64 OpenSSH package
        if: matrix.arch.name == 'aarch64' && (matrix.artifact == 'build-installers' || matrix.artifact == 'full')
        shell: pwsh
        run: |
          ./t/check-arm64-openssh-package.ps1 `
            -Package "$env:RUNNER_TEMP\win32-openssh.pkg.tar.zst" `
            -Scanner (Convert-Path ./pe-imports.ps1) `
            -SdkRoot (Convert-Path sdk-artifact)
      - name: build installer
        if: matrix.artifact == 'build-installers'
        shell: bash
        run: ./installer/release.sh --include-self-check --output=$PWD/installer-${{ matrix.arch.name }} 0-test
      - uses: actions/upload-artifact@v7
        if: matrix.artifact == 'build-installers'
        with:
          name: installer-${{ matrix.arch.name }}
          path: installer-${{ matrix.arch.name }}
      - name: measure ARM64 installer download
        if: matrix.arch.name == 'aarch64' && matrix.artifact == 'build-installers'
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath installer-${{ matrix.arch.name }} -File |
            ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }
      - name: run the installer
        if: matrix.artifact == 'build-installers'
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path installer-${{ matrix.arch.name }}/*.exe | %{$_.FullName}
          $installer = Start-Process -PassThru -Wait -FilePath "$exePath" -ArgumentList "/SILENT /VERYSILENT /NORESTART /SUPPRESSMSGBOXES /ALLOWDOWNGRADE=1 /ALLOWINSTALLING32ON64=1 /LOG=installer.log"
          $exitCode = $installer.ExitCode
          if ($exitCode -ne 0) {
            Write-Host "::error::Installer failed with exit code $exitCode!"
            exit 1
          }
          if ("${{ matrix.arch.name }}" -eq "i686") {
            "${env:ProgramFiles(x86)}\Git\usr\bin" | Out-File -Encoding ascii -Append $env:GITHUB_PATH
            "${env:ProgramFiles(x86)}\Git\${{ matrix.arch.mingw-prefix }}\bin" | Out-File -Encoding ascii -Append $env:GITHUB_PATH
          } else {
            "$env:ProgramFiles\Git\usr\bin" | Out-File -Encoding ascii -Append $env:GITHUB_PATH
            "$env:ProgramFiles\Git\${{ matrix.arch.mingw-prefix }}\bin" | Out-File -Encoding ascii -Append $env:GITHUB_PATH
          }
      - name: show installer log
        # run this even if the installation failed (actually, _in particular_ when the installation failed)
        if: always() && matrix.artifact == 'build-installers'
        shell: bash
        run: cat installer.log
      - name: validate
        if: matrix.artifact == 'build-installers'
        shell: bash
        run: |
          set -x &&
          grep 'Installation process succeeded' installer.log &&
          ! grep -iw failed installer.log &&
          cygpath -aw / &&
          git.exe version --build-options >version &&
          cat version &&
          grep "${{ steps.build-artifact.outputs.git-version }}" version &&
          checklist=installer/run-checklist.sh &&
          if test aarch64 != "${{ matrix.arch.name }}"
          then
            # Keep the existing read-only fallback outside ARM64.
            sed -i 's|git@ssh.dev.azure.com:v3/git-for-windows/git/git|https://github.com/git/git|' $checklist
          else
            export GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new'
          fi &&
          sh -x $checklist &&
          git update-git-for-windows --test-version-compare
      - name: validate ARM64 installer lifecycle and external SSH
        if: always() && matrix.arch.name == 'aarch64' && matrix.artifact == 'build-installers'
        shell: pwsh
        run: |
          $exePath = (Get-ChildItem -Path installer-${{ matrix.arch.name }}/*.exe | Select-Object -First 1).FullName
          ./t/check-arm64-openssh-installer.ps1 `
            -Installer $exePath `
            -Package "$env:RUNNER_TEMP\win32-openssh.pkg.tar.zst" `
            -Scanner (Convert-Path ./pe-imports.ps1)
  check-for-missing-dlls:
    needs: determine-packages
    if: needs.determine-packages.outputs.test-sdk-artifacts == 'true' || needs.determine-packages.outputs.check-for-missing-dlls == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: i686
            mingw-prefix: mingw32
            msystem: MINGW32
            sdk-repo: git-sdk-32
            runner: windows-latest
          - name: x86_64
            mingw-prefix: mingw64
            msystem: MINGW64
            sdk-repo: git-sdk-64
            runner: windows-latest
          - name: ucrt64
            mingw-prefix: ucrt64
            msystem: UCRT64
            sdk-repo: git-sdk-64
            sdk-branch: ucrt64
            runner: windows-latest
          - name: aarch64
            mingw-prefix: clangarm64
            msystem: CLANGARM64
            sdk-repo: git-sdk-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: initialize bare SDK clone
        shell: bash
        run: |
          git clone --bare --depth=1 --single-branch \
            --branch=${{ matrix.arch.sdk-branch || 'main' }} --filter=blob:none \
            https://github.com/git-for-windows/${{ matrix.arch.sdk-repo }} .sdk
      - name: build build-installers-${{ matrix.arch.name }} artifact
        if: matrix.arch.name == 'aarch64'
        shell: bash
        run: |
          GFW_ARM64_BUSYBOX=0 \
          ./please.sh create-sdk-artifact \
            --architecture=${{ matrix.arch.name }} \
            --sdk=.sdk \
            --out=sdk-artifact-before \
            build-installers
      - name: build build-installers-${{ matrix.arch.name }} artifact
        shell: bash
        run: |
          set -x &&
          INCLUDE_OBJDUMP=t \
          ./please.sh create-sdk-artifact \
            --architecture=${{ matrix.arch.name }} \
            --sdk=.sdk \
            --out=sdk-artifact \
            build-installers &&
          cygpath -aw "$PWD/sdk-artifact/usr/bin/core_perl" >>$GITHUB_PATH &&
          cygpath -aw "$PWD/sdk-artifact/usr/bin" >>$GITHUB_PATH &&
          cygpath -aw "$PWD/sdk-artifact/${{ matrix.arch.mingw-prefix }}/bin" >>$GITHUB_PATH &&
          echo "MSYSTEM=${{ matrix.arch.msystem }}" >>$GITHUB_ENV &&
          cat $GITHUB_PATH
      - name: check for missing DLLs
        shell: bash
        run: sh -x ./check-for-missing-dlls.sh
      - name: check for missing DLLs (MinGit)
        shell: bash
        run: MINIMAL_GIT=1 ./check-for-missing-dlls.sh
      - name: check for missing DLLs (BusyBox MinGit)
        if: matrix.arch.name == 'aarch64'
        shell: bash
        run: MINIMAL_GIT=1 MINIMAL_GIT_WITH_BUSYBOX=1 ./check-for-missing-dlls.sh
      - name: load the fork-local payload scanner
        if: matrix.arch.name == 'aarch64'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin refs/pull/1/head &&
          test 9e8e3eb929ae5c7fe8a2d899be2eefdc07356c19 = \
            "$(git rev-parse FETCH_HEAD)" &&
          git show FETCH_HEAD:pe-imports.ps1 >pe-imports-pr1.ps1 &&
          echo '30adb26e7a4df9946a1c7b145e6613f3efb116745ad09a0978f89cb592932d84 *pe-imports-pr1.ps1' |
            sha256sum -c -
      - name: compare ARM64 payload architectures
        if: matrix.arch.name == 'aarch64'
        shell: bash
        run: |
          ./t/check-arm64-busybox-architecture.sh \
            --before=sdk-artifact-before \
            --after=sdk-artifact \
            --scanner=pe-imports-pr1.ps1
      - uses: actions/upload-artifact@v7
        if: matrix.arch.name == 'aarch64'
        with:
          name: arm64-busybox-architecture-report
          path: arm64-busybox-architecture-report.txt
      - name: check ARM64 BusyBox compatibility
        if: matrix.arch.name == 'aarch64'
        shell: bash
        run: ./t/check-arm64-busybox.sh
      - name: check ARM64 BusyBox replacement PEs
        if: matrix.arch.name == 'aarch64'
        shell: pwsh
        run: |
          ./t/check-arm64-busybox.ps1 `
            -Root (Convert-Path sdk-artifact) `
            -Scanner (Convert-Path pe-imports-pr1.ps1)
      - name: check native ARM64 tools from Git Bash
        if: matrix.arch.name == 'aarch64'
        shell: bash
        run: ./t/check-arm64-native-tools.sh
      - name: check native ARM64 tools from Win32
        if: matrix.arch.name == 'aarch64'
        shell: pwsh
        run: ./t/check-arm64-native-tools.ps1 -Root (Convert-Path sdk-artifact)
  arm64-busybox-impact:
    needs: determine-packages
    if: needs.determine-packages.outputs.check-for-missing-dlls == 'true'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: prepare exact base source and SDK
        shell: bash
        run: |
          test 39ffc22208aa99e287a9f433431fb9a56f443b62 = \
            "$(git rev-parse origin/crutkas-arm64-native-leaf-tools)" &&
          git worktree add --detach base-source \
            39ffc22208aa99e287a9f433431fb9a56f443b62 &&
          git clone --bare --depth=1 --single-branch --branch=main \
            --filter=blob:none \
            https://github.com/git-for-windows/git-sdk-arm64 .sdk
      - name: stage base and integrated SDKs
        shell: bash
        run: |
          ./base-source/please.sh create-sdk-artifact \
            --architecture=aarch64 \
            --sdk=.sdk \
            --out=sdk-base \
            build-installers &&
          ./please.sh create-sdk-artifact \
            --architecture=aarch64 \
            --sdk=.sdk \
            --out=sdk-integrated \
            build-installers
      - name: build base and integrated distributions
        shell: bash
        run: |
          build_products () {
            sdk=$1
            source=$2
            output=$3
            mkdir -p "$output/mingit-busybox" &&
            "$sdk/git-cmd.exe" --command=usr\\bin\\bash.exe -lc "
              set -e
              cd '$source'
              ./installer/release.sh --output='$output' 0-test
              ./portable/release.sh --output='$output' 0-test
              ./mingit/release.sh --output='$output' 0-test
              ./mingit/release.sh --busybox \
                --output='$output/mingit-busybox' 0-test
            "
          }

          root=$PWD &&
          build_products "$root/sdk-base" "$root/base-source" "$root/impact/base" &&
          build_products "$root/sdk-integrated" "$root" "$root/impact/integrated"
      - name: measure distributions and lifecycle
        shell: pwsh
        run: |
          ./t/check-arm64-busybox-distributions.ps1 `
            -BaseInstaller impact/base/Git-0-test-arm64.exe `
            -IntegratedInstaller impact/integrated/Git-0-test-arm64.exe `
            -BasePortable impact/base/PortableGit-0-test-arm64.7z.exe `
            -IntegratedPortable impact/integrated/PortableGit-0-test-arm64.7z.exe `
            -BaseMinGit impact/base/MinGit-0-test-arm64.zip `
            -IntegratedMinGit impact/integrated/MinGit-0-test-arm64.zip `
            -BaseBusyBoxMinGit impact/base/mingit-busybox/MinGit-0-test-arm64.zip `
            -IntegratedBusyBoxMinGit impact/integrated/mingit-busybox/MinGit-0-test-arm64.zip `
            -OutputDirectory impact/measurements
      - uses: actions/upload-artifact@v7
        with:
          name: arm64-busybox-distribution-impact
          path: |
            impact/measurements/arm64-busybox-distribution-impact.json
            impact/measurements/arm64-busybox-distribution-impact.md
